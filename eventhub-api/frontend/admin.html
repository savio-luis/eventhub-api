<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>EventHub - Área do Organizador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="eventos.html">🎓 EventHub</a>
      <div>
        <a href="eventos.html" class="btn btn-outline-light btn-sm me-2">Ver Eventos</a>
        <button onclick="logout()" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <div class="container py-3">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h4 class="card-title text-primary mb-4">📢 Criar Novo Evento</h4>

            <form id="formEvento">
              <div class="mb-3">
                <label class="form-label">Título do Evento</label>
                <input type="text" id="titulo" class="form-control" placeholder="Ex: Semana de Tecnologia 2026" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea id="descricao" class="form-control" rows="3" placeholder="Detalhes do evento..."></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label">Data e Hora</label>
                <input type="datetime-local" id="dataEvento" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Capacidade (Vagas)</label>
                <input type="number" id="capacidade" class="form-control" value="50" required>
              </div>

              <div class="mb-3">
                <label class="form-label">ID do Organizador (Seu Usuário)</label>
                <input type="number" id="organizadorId" class="form-control" value="1" required>
              </div>

              <button type="submit" class="btn btn-primary w-100">Publicar Evento</button>
            </form>

            <div id="mensagem" class="mt-3 alert d-none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/api/v1";

    const savedId = localStorage.getItem('usuario_id');
    if (savedId) {
      document.getElementById('organizadorId').value = savedId;
    }

    document.getElementById('formEvento').addEventListener('submit', async (e) => {
      e.preventDefault();

      const rawDate = document.getElementById('dataEvento').value;
      const formattedDate = new Date(rawDate).toISOString();
      const orgId = parseInt(document.getElementById('organizadorId').value);

      const dados = {
        titulo: document.getElementById('titulo').value,
        descricao: document.getElementById('descricao').value,
        data_evento: formattedDate,
        capacidade: parseInt(document.getElementById('capacidade').value),
        organizador_id: orgId
      };

      try {
        const resp = await fetch(`${API_URL}/eventos/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const msg = document.getElementById('mensagem');
        msg.classList.remove('d-none', 'alert-danger', 'alert-success');

        if (resp.ok) {
          msg.classList.add('alert-success');
          msg.innerText = "Evento publicado com sucesso! Redirecionando...";
          setTimeout(() => window.location.href = 'eventos.html', 1500);
        } else {
          const err = await resp.json();
          msg.classList.add('alert-danger');
          if (Array.isArray(err.detail)) {
            msg.innerText = err.detail.map(item => `Campo '${item.loc[item.loc.length - 1]}': ${item.msg}`).join(' | ');
          } else {
            msg.innerText = err.detail || "Erro ao criar evento.";
          }
        }
      } catch (error) {
        const msg = document.getElementById('mensagem');
        msg.classList.remove('d-none', 'alert-success');
        msg.classList.add('alert-danger');
        msg.innerText = "Erro de conexão com o servidor.";
      }
    });

    function logout() {
      localStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
