
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>EventHub - Login & Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="text-center text-primary mb-4">🎓 EventHub API</h3>
            
            <!-- Formulário de Login -->
            <form id="formLogin">
              <h5 class="card-title mb-3">Entrar no Sistema</h5>
              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" id="loginEmail" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" id="loginSenha" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <hr class="my-4">

            <!-- Formulário de Cadastro -->
            <form id="formCadastro">
              <h5 class="card-title mb-3">Criar Nova Conta</h5>
              <div class="mb-3">
                <input type="text" id="cadNome" class="form-control" placeholder="Nome Completo" required>
              </div>
              <div class="mb-3">
                <input type="email" id="cadEmail" class="form-control" placeholder="Seu E-mail" required>
              </div>
              <div class="mb-3">
                <input type="password" id="cadSenha" class="form-control" placeholder="Sua Senha" required>
              </div>
              <div class="mb-3">
                <select id="cadPerfil" class="form-select">
                  <option value="participante">Participante</option>
                  <option value="organizador">Organizador</option>
                </select>
              </div>
              <button type="submit" class="btn btn-outline-success w-100">Cadastrar</button>
            </form>

            <div id="mensagem" class="mt-3 alert d-none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/api/v1";

    // Cadastro
    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const dados = {
        nome: document.getElementById('cadNome').value,
        email: document.getElementById('cadEmail').value,
        senha: document.getElementById('cadSenha').value,
        perfil: document.getElementById('cadPerfil').value
      };

      const resp = await fetch(`${API_URL}/usuarios/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });

      const msg = document.getElementById('mensagem');
      msg.classList.remove('d-none', 'alert-danger', 'alert-success');

      if (resp.ok) {
        msg.classList.add('alert-success');
        msg.innerText = "Conta criada com sucesso! Faça login acima.";
      } else {
        const err = await resp.json();
        msg.classList.add('alert-danger');
        msg.innerText = err.detail || "Erro ao criar conta.";
      }
    });

    // Login
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const dados = {
        email: document.getElementById('loginEmail').value,
        senha: document.getElementById('loginSenha').value
      };

      const resp = await fetch(`${API_URL}/usuarios/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });

      const msg = document.getElementById('mensagem');
      msg.classList.remove('d-none', 'alert-danger', 'alert-success');

      if (resp.ok) {
        const resData = await resp.json();
        localStorage.setItem('token', resData.access_token);
        localStorage.setItem('usuario_id', resData.usuario_id);
        msg.classList.add('alert-success');
        msg.innerText = "Login efetuado com sucesso! Redirecionando...";
        setTimeout(() => window.location.href = 'eventos.html', 1500);
      } else {
        msg.classList.add('alert-danger');
        msg.innerText = "E-mail ou senha inválidos.";
      }
    });
  </script>
</body>
</html>
